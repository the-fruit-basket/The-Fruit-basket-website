<!DOCTYPE html>
<html>
<head>
<title>Fresh Basket</title>
<style>
body {
font-family: Arial;
margin: 0;
background: #f5f5f5;
}

header {
background: green;
color: white;
padding: 15px;
text-align: center;
font-size: 24px;
}

.container {
padding: 20px;
}

h2 {
margin-top: 30px;
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
gap: 15px;
}

.card {
background: white;
padding: 15px;
border-radius: 10px;
box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

button {
background: green;
color: white;
border: none;
padding: 8px;
border-radius: 5px;
cursor: pointer;
margin-top: 10px;
}

#cart {
position: fixed;
right: 0;
top: 0;
width: 250px;
height: 100%;
background: white;
border-left: 2px solid #ccc;
padding: 10px;
overflow-y: auto;
}
</style>
</head>

<body>

<header>Fresh Basket 🛒</header>

<div class="container">

<h2>Fruits</h2>
<div class="grid" id="fruits"></div>

<h2>Vegetables</h2>
<div class="grid" id="veggies"></div>

<h2>Kitchen</h2>
<div class="grid" id="kitchen"></div>

</div>

<div id="cart">
<h3>Cart</h3>
<ul id="cart-items"></ul>
<p><b>Total: $<span id="total">0</span></b></p>
</div>

<script>
const fruits = [
["Watermelon sliced",5.99],["Pink lady apples",9.99],["Grapefruit pink",5.99],
["Peaches White",12.99],["Apple royal gala",9.99],["Nectarines white",12.99],
["Granny smith apples",9.99],["Navel Oranges",9.99],["Apple Fuji",11.99],
["Orange Mid knight",9.99],["Grapes Green Loose",19.99],["Grapes Red Loose",19.99],
["Plums",9.99],["Rosata Pears",9.99],["Pears Red",7.99],
["Mandarin Tango Seedless",7.99],["Plums Teagan Blue",9.99],
["Pears Brown Bosc",8.99],["Mandarin Loose",7.99],
["Kiwifruit",2.99],["Apple Mi",9.99],["Apricots",29.99],
["Apple Regal gala",9.99],["Peaches Yellow",12.99]
];

const veggies = [
["Cabbage Half",2.99],["Cabbage Red Half",2.99],["Cabbage Savoy Half",1.99],
["Cauliflower Half",2.99],["Cabbage Chinese Half",2.99],
["Broccoli Cauliflower Pieces",4.54],["Broccoli Bunch",3.99],
["Savoy Cabbage",5.99],["Chinese Cabbage",4.99],["Red Cabbage",5.99],
["Cabbage Green",4.99],["Cauliflower Whole",5.99],["Large Leeks",3.99],
["Pak Choy",2.99],["Bok Choy",2.99],["Choi Sum",2.99],
["Green Festival",3.99],["Red Festival",3.99],
["Silverbeet Bunch",3.99],["Kale",3.99],["Lettuce Iceberg",3.99],
["Basil Loose",29.99],["Parsley Curly",3.99],["Parsley Italian",3.99],
["Mint",3.99],["Coriander",4.99],["Celery Half",1.99],
["Spring Onion Loose",9.99],["Celery Sticks",9.99],
["Spring Onion Bunch",3.99],["Lettuce Cos",2.99],
["Celery Whole",3.99],["Baby Cos Lettuce",2.99]
];

const kitchen = [
["Regular Fruit Platter",29.99],
["Large Fruit Platter",55.00]
];

let total = 0;

function displayItems(items, containerId){
const container = document.getElementById(containerId);
items.forEach(item => {
const div = document.createElement("div");
div.className = "card";
div.innerHTML = `
<h4>${item[0]}</h4>
<p>$${item[1]}</p>
<button onclick="addToCart('${item[0]}', ${item[1]})">Add to Cart</button>
`;
container.appendChild(div);
});
}

function addToCart(name, price){
const cart = document.getElementById("cart-items");
const li = document.createElement("li");
li.textContent = name + " - $" + price;
cart.appendChild(li);

total += price;
document.getElementById("total").textContent = total.toFixed(2);
}

displayItems(fruits, "fruits");
displayItems(veggies, "veggies");
displayItems(kitchen, "kitchen");

</script>

</body>
</html>
